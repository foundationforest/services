# Every service's checks, and the loop's, from a clean install, on every pull request and every push
# to main. Each job first fetches the standard and the markets at their pins and builds the standard
# (standard.sh), then installs what it uses.
#
#   verifier     its type-check (the stand-in Didit for tests included) and its tests: stamp proofs made
#                from its stamps and checked against its published keys, the facts vectors, the
#                face embedding's on the real models and portraits its `npm run fetch` checks by
#                SHA-256, and its welcome gift's ticket taken by the host's own seller, bought with
#                the host's credits client
#   index        its type-check and its tests, on loopback: the standard's reference host, real stamp
#                proofs from the stamp circuit's committed proving files, a real reputation proof (the
#                reputation circuit's proving files, fetched), a stand-in RPC, and the index end to end
#   fee-payer    the local run's type-check, against the standard's escrow client, and the kora.toml
#                its Dockerfile makes with deploy/devnet-config.sh
#   host         its type-check and its credits' tests, through the standard's reference host
#   e2e          the loop's type-check, which reads the verifier's, host's, index's and mcp's code it
#                starts, and mcp's reference signer and test client it acts through; and its tests:
#                the credits client against the host's own code selling for tickets and for a dollar,
#                the funding and minting it does, a direct payment, the market's schedule as the
#                escrow takes it, and a run's record
#   mcp          its type-check and tests, on loopback: the standard's reference host, a stand-in
#                index and connect page, and its reference signer; the login end to end through the
#                MCP SDK's client, every tool, the relay, and the image's own command
#
# Not here, and in each directory's README: the fee payer's local run, which needs a local validator
# and Kora built; the loop itself, which needs the phrase and the chain; and mcp's smoke test against
# the deployed copy.
#
# A test that finds a piece missing skips instead of failing. Here a skip fails the step: the TAP
# summary must say "# skipped 0", so a missing piece never passes as green.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    shell: bash

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
          (cd verifier && npm ci --no-audit --no-fund && npm run fetch)
      - name: Type-check
        working-directory: verifier
        run: npm run check
      - name: Test
        working-directory: verifier
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd standard/proofs/reputation/circuit && npm run fetch)
          (cd index && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: index
        run: npm run check
      - name: Test
        working-directory: index
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  fee-payer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd fee-payer && npm ci --no-audit --no-fund)
      - name: The local run's type-check
        working-directory: fee-payer
        run: npm run check
      - name: The image's kora.toml
        run: bash fee-payer/deploy/devnet-config.sh fee-payer/kora.toml > /dev/null

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: host
        run: npm run check
      - name: Test
        working-directory: host
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd verifier && npm ci --no-audit --no-fund)
          (cd host && npm ci --no-audit --no-fund)
          (cd index && npm ci --no-audit --no-fund)
          (cd mcp && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: e2e
        run: npm run check
      - name: Test
        working-directory: e2e
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd mcp && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: mcp
        run: npm run check
      - name: Test
        working-directory: mcp
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"
