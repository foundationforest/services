# Every service's checks, and the loop's, from a clean install, on every pull request and every push
# to main. Each job first fetches the standard and the markets at their pins and builds the standard
# (standard.sh), then installs what it uses.
#
#   verifier     its type-check (the stand-in Didit for tests included) and its tests: verifications
#                made from its stamps and checked against its published keys, the facts vectors, the
#                face embedding's on the real models and portraits its `npm run fetch` checks by
#                SHA-256, and its welcome gift's ticket taken by the host's own seller, bought with
#                the host's credits client
#   index        its type-check and its tests, on loopback: this repo's host (its plug), real
#                verifications and a real reputation proof from the circuits' committed proving files,
#                and the index end to end
#   host         its type-check and its tests: the standard's host check against the plug and against
#                the whole host, the plug's own tests and its storage's, and its credits'
#   e2e          the loop's type-check, which reads the verifier's, host's, index's and mcp's code it
#                starts, and mcp's reference app and test client it acts through; and its tests:
#                the credits client against the host's own code selling for tickets, and alone
#                against Cloudflare's own Privacy Pass issuer
#   loop         the loop itself, `npm run e2e`: two people through the loop's own verifier, host,
#                index and mcp on loopback, with no chain and no secret; it passes or fails the job
#   mcp          its type-check and tests, on loopback: this repo's host (its plug), a stand-in index
#                and connect page, and its reference app; the login end to end through the MCP
#                SDK's client and the connection, every tool in the person's folders, and the
#                image's own command
#
# Not here, and in mcp's README: its smoke test against the deployed copy.
#
# A test that finds a piece missing skips instead of failing. Here a skip fails the step: the TAP
# summary must say "# skipped 0", so a missing piece never passes as green.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    shell: bash

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
          (cd verifier && npm ci --no-audit --no-fund && npm run fetch)
      - name: Type-check
        working-directory: verifier
        run: npm run check
      - name: Test
        working-directory: verifier
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
          (cd index && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: index
        run: npm run check
      - name: Test
        working-directory: index
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: host
        run: npm run check
      - name: Test
        working-directory: host
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd verifier && npm ci --no-audit --no-fund)
          (cd host && npm ci --no-audit --no-fund)
          (cd index && npm ci --no-audit --no-fund)
          (cd mcp && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: e2e
        run: npm run check
      - name: Test
        working-directory: e2e
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd verifier && npm ci --no-audit --no-fund)
          (cd host && npm ci --no-audit --no-fund)
          (cd index && npm ci --no-audit --no-fund)
          (cd mcp && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
      - name: The loop
        working-directory: e2e
        run: npm run e2e

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
          (cd mcp && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: mcp
        run: npm run check
      - name: Test
        working-directory: mcp
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"
