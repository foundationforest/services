# Every service's checks from a clean install, on every pull request and every push to main. Each job
# first fetches standard at the commit in STANDARD (standard.sh) and installs the standard packages it uses.
#
#   issuer       its type-check (the stand-in Didit for tests included) and its tests: note proofs made
#                from its notes and checked against its published keys, the attributes vectors, the
#                face embedding's on the real models and portraits its `npm run fetch` checks by
#                SHA-256, and its welcome gift's ticket taken by the host's own seller
#   index        its type-check, and its unit, page, reputation and tier tests on a Postgres service
#                (real reputation proofs: the reputation circuit's proving files; a real person proof: the
#                standard's example card's)
#   fee-payer    the local run's type-check, against the standard's escrow client, and the kora.toml
#                its Dockerfile makes with deploy/devnet-config.sh
#   host         the foundation's host: its type-check and its credits' tests, through the standard's
#                reference host (standard.sh installs and builds the whole standard)
#   e2e          the devnet run's type-check, with mcp's actions it runs and the index's signing key
#                it reads, and the credits client's tests against a stand-in service made of
#                Cloudflare's own issuer
#   mcp          mcp's type-check and tests: every tool on the standard's reference host and a
#                stand-in index, with the markets standard.sh fetches at MARKETS; both doors; and the
#                image's own command through the MCP SDK's client
#
# Not here: the fee payer's local run, the index's end-to-end test, the e2e run itself and the smoke
# run against the deployed mcp. The first two need the standard's programs, its proving files, a local
# validator and (for the fee payer) Kora built; the last two need the deployed services, and the e2e
# run the devnet phrase.
#
# A test that finds a piece missing skips instead of failing. Here a skip fails the step: the TAP
# summary must say "# skipped 0", so a missing piece never passes as green.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

defaults:
  run:
    shell: bash

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd e2e && npm ci --no-audit --no-fund)
          (cd host && npm ci --no-audit --no-fund)
          (cd issuer && npm ci --no-audit --no-fund && npm run fetch)
      - name: Type-check
        working-directory: issuer
        run: npm run check
      - name: Test
        working-directory: issuer
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records registry/client escrow/client reputation/client
          (cd standard/reputation/circuit && npm run fetch)
          (cd index && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: index
        run: npm run check
      - name: Test (everything but the end-to-end test)
        working-directory: index
        run: |
          node --test --test-force-exit test/markets.test.ts test/scoring.test.ts test/sign.test.ts test/server.test.ts test/pages.test.ts test/reputation.test.ts test/tiers.test.ts | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  fee-payer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd fee-payer && npm ci --no-audit --no-fund)
      - name: The local run's type-check
        working-directory: fee-payer
        run: npm run check
      - name: The image's kora.toml
        run: bash fee-payer/deploy/devnet-config.sh fee-payer/kora.toml > /dev/null

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd host && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: host
        run: npm run check
      - name: Test
        working-directory: host
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records registry/client escrow/client reputation/client
          (cd mcp && npm ci --no-audit --no-fund)
          (cd index && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: e2e
        run: npm run check
      - name: Test (the credits client)
        working-directory: e2e
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh
          (cd mcp && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: mcp
        run: npm run check
      - name: Test
        working-directory: mcp
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"
