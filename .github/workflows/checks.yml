# Every service's checks from a clean install, on every pull request and every push to main. Each job
# first fetches standard at the commit in STANDARD (standard.sh) and installs the standard packages it uses.
#
#   issuer       its type-check (the stand-in Didit included) and its tests, the face embedding's on
#                the real models and portraits its `npm run fetch` checks by SHA-256
#   index        its type-check, and its unit, page, reputation and tier tests on a Postgres service
#                (real reputation proofs: circuits' proving files; a real person proof: forest's
#                example card's)
#   fee-payer    the local run's type-check (at-cost/), the devnet kora.toml its Dockerfile makes from
#                at-cost/ and registry/, and the voucher check's type-check and tests (registry/; real
#                person proofs: the person circuit's files, committed in forest)
#   host         the foundation's host: its type-check and its tests
#   e2e          the devnet run's type-check, with the CLI it runs (mcp/)
#   mcp          the CLI's type-check and tests: every action on records' reference host, both doors,
#                and the hosted copy's smoke test, the image's own command through the MCP SDK's client
#
# Not here: the fee payer's local run, the index's end-to-end test, the e2e run itself and the smoke
# run against the deployed mcp. The first two need forest's programs, its proving files, a local
# validator and (for the fee payer) Kora built; the last two need the deployed services, and the e2e
# run the devnet phrase.
#
# A test that finds a piece missing skips instead of failing. Here a skip fails the step: the TAP
# summary must say "# skipped 0", so a missing piece never passes as green.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

defaults:
  run:
    shell: bash

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh registry/client records keys
          (cd issuer && npm ci --no-audit --no-fund && npm run fetch)
      - name: Type-check
        working-directory: issuer
        run: npm run check
      - name: Test
        working-directory: issuer
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records registry/client escrow/client circuits/reputation
          (cd standard/circuits/reputation && npm run fetch)
          (cd index && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: index
        run: npm run check
      - name: Test (everything but the end-to-end test)
        working-directory: index
        run: |
          node --test --test-force-exit test/markets.test.ts test/scoring.test.ts test/sign.test.ts test/server.test.ts test/pages.test.ts test/reputation.test.ts test/tiers.test.ts | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  fee-payer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh registry/client escrow/client
          (cd fee-payer/at-cost && npm ci --no-audit --no-fund)
          (cd fee-payer/registry && npm ci --no-audit --no-fund)
      - name: The local run's type-check
        working-directory: fee-payer/at-cost
        run: npm run check
      - name: The devnet kora.toml, for both Koras
        run: |
          bash fee-payer/deploy/devnet-config.sh fee-payer/at-cost/kora.toml > /dev/null
          bash fee-payer/deploy/devnet-config.sh fee-payer/registry/kora.toml > /dev/null
      - name: The voucher check's type-check
        working-directory: fee-payer/registry
        run: npm run check
      - name: The voucher check's tests
        working-directory: fee-payer/registry
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records registry/client
          (cd host && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: host
        run: npm run check
      - name: Test
        working-directory: host
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records registry/client escrow/client circuits/reputation
          (cd mcp && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: e2e
        run: npm run check

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./standard.sh keys records
          (cd mcp && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: mcp
        run: npm run check
      - name: Test
        working-directory: mcp
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"
