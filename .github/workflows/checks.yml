# Every service's checks from a clean install, on every pull request and every push to main. Each job
# first fetches forest at the commit in FOREST (forest.sh) and installs the forest packages it uses.
#
#   issuer       its type-check (the stand-in Didit included) and its tests
#   index        its type-check, and its unit and page tests on a Postgres service
#   fee-payer    its type-check, the devnet kora.toml its two Dockerfiles make from general/ and
#                sponsored/, and the pre-check's type-check and tests (real proofs: the proving files)
#   connections  its type-check, and its tests against forest's reference host
#   host         Soil's host: its type-check and its tests
#   e2e          the devnet run's type-check
#
# Not here: the fee payer's local run, the index's end-to-end test and the e2e run itself. The first
# two need forest's programs, its proving files, a local validator and (for the fee payer) Kora
# built; the third needs the devnet phrase and the deployed services.
#
# A test that finds a piece missing skips instead of failing. Here a skip fails the step: the TAP
# summary must say "# skipped 0", so a missing piece never passes as green.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

defaults:
  run:
    shell: bash

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh registry/client records
          (cd issuer && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: issuer
        run: npm run check
      - name: Test
        working-directory: issuer
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh keys records registry/client escrow/client
          (cd index && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: index
        run: npm run check
      - name: Test (everything but the end-to-end test)
        working-directory: index
        run: |
          node --test --test-force-exit test/markets.test.ts test/scoring.test.ts test/sign.test.ts test/pages.test.ts | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  fee-payer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh registry/client registry/artifacts escrow/client
          (cd forest/registry/artifacts && npm run fetch)
          (cd fee-payer && npm ci --no-audit --no-fund)
          (cd fee-payer/sponsor && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: fee-payer
        run: npm run check
      - name: The devnet kora.toml, for both nodes
        run: |
          bash fee-payer/deploy/devnet-config.sh fee-payer/general/kora.toml > /dev/null
          bash fee-payer/deploy/devnet-config.sh fee-payer/sponsored/kora.toml > /dev/null
      - name: The pre-check's type-check
        working-directory: fee-payer/sponsor
        run: npm run check
      - name: The pre-check's tests
        working-directory: fee-payer/sponsor
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh keys records
          (cd connections && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: connections
        run: npm run check
      - name: Test
        working-directory: connections
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh keys records registry/client
          (cd host && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: host
        run: npm run check
      - name: Test
        working-directory: host
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          ./forest.sh keys records registry/client escrow/client
          (cd e2e && npm ci --no-audit --no-fund)
      - name: Type-check
        working-directory: e2e
        run: npm run check
