# The fee payer's one key, its own. Nothing here holds it: Kora reads it from the file whose path is
# in the environment variable named below, a keypair file in the Solana CLI's JSON form. run.sh makes
# that file on the volume at the first start and sets the variable to its path.

[signer_pool]
strategy = "round_robin"

[[signers]]
name = "forest_fee_payer"
type = "memory"
private_key_env = "FOREST_FEE_PAYER_KEY"
