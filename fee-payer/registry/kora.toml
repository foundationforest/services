# The registry payer's Kora: Kora 2.0.5 (the version in KORA), configured. Nothing custom inside it.
#
# It pays for a person's registry row and charges nothing: the network fee and the row's deposit,
# which the registry program creates inside its own call. Nobody reaches it but the front before it
# (registry/src/), which lets through only one `register` and only against a credit it holds for that
# row; this file is what Kora itself still refuses after that.
#
# It allows one Forest program, the registry, at its devnet address (standard/registry/devnet/
# devnet.json), and System, which the registry calls to create the row. deploy/devnet-config.sh
# changes the same three lines here as in at-cost/kora.toml. Every key Kora 2.0.5 requires in a
# table is written out, so nothing here is a default someone has to look up.

[kora]
# Requests per second, across all callers (Kora's own global limiter). It holds a request over the
# limit until the next second rather than refusing it, so a row the front lets through is never
# refused for the limit.
rate_limit = 1

[validation]
# The most SOL one transaction may take from the fee payer beyond its network fee: the row's deposit.
# 0.0024 SOL. The largest row (a 128-byte label, 308 bytes) takes 2,214,880 lamports at today's rent,
# 5,080 lamports a byte on devnet and mainnet; Solana's storage price only falls.
max_allowed_lamports = 2400000
# The fee payer and the main key, which signs the row.
max_signatures = 2
# Kora checks these against every program a transaction calls, the ones called from inside other
# programs included.
allowed_programs = [
  "J4ES52YohsZhknYbsgmZwHpyNw14EjrrGZxHpcmcBmq4", # the Forest registry, on devnet
  "11111111111111111111111111111111",            # System: the registry creates the row with it
]
# Never used: in free mode Kora prices nothing and is paid nothing. Kora 2.0.5 refuses to start
# with no allowed token, and these three lines are at-cost/kora.toml's own, so devnet-config.sh
# changes both files the same way.
allowed_tokens = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", "ousd2mJsPEckLHcSCDxyKD7NDGARZcfLbDZkKiatYHB", "HzwqbKZw8HxMN6bF2yFZNrht3c2iXXzpKcFu7uBEDKtr"]
allowed_spl_paid_tokens = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", "ousd2mJsPEckLHcSCDxyKD7NDGARZcfLbDZkKiatYHB", "HzwqbKZw8HxMN6bF2yFZNrht3c2iXXzpKcFu7uBEDKtr"]
disallowed_accounts = []
# Jupiter needs JUPITER_API_KEY in the environment to start, even here, where nothing is priced.
price_source = "Jupiter"

# Nothing is charged.
[validation.price]
type = "free"

# What the fee payer's own key may do inside a transaction. Only one thing: pay for a new account,
# the row. It may not send its SOL or its tokens anywhere, assign or allocate its own account, or
# act as the owner or authority of any token account or mint.
[validation.fee_payer_policy.system]
allow_transfer = false
allow_assign = false
allow_create_account = true
allow_allocate = false

[validation.fee_payer_policy.system.nonce]
allow_initialize = false
allow_advance = false
allow_withdraw = false
allow_authorize = false

[validation.fee_payer_policy.spl_token]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.fee_payer_policy.token_2022]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false
